name: Release

# Roda sempre que uma tag é enviada (ex.: git tag v0.1.0 && git push origin v0.1.0).
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib: atemigo_chip8_libretro.so
          - os: windows-latest
            platform: windows-x86_64
            lib: atemigo_chip8_libretro.dll
          - os: macos-latest
            platform: macos-arm64
            lib: atemigo_chip8_libretro.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          g++ -std=c++20 -O2 -Wall -fPIC -shared
          -static-libstdc++ -static-libgcc
          src/libretro/libretro.cpp -o ${{ matrix.lib }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          clang++ -std=c++20 -O2 -Wall -dynamiclib
          src/libretro/libretro.cpp -o ${{ matrix.lib }}

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cl /nologo /std:c++20 /O2 /EHsc /MT /LD src\libretro\libretro.cpp /Fe:${{ matrix.lib }}

      - name: Package
        shell: bash
        run: |
          name="atemigo_chip8_libretro-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir "$name"
          cp "${{ matrix.lib }}" README.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            zip -r "$name.zip" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: atemigo_chip8_libretro-*.zip

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
